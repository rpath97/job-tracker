name: Check dependency advisories

on:
  push:
    branches: [fix/account-data-isolation]
    paths: [.github/workflows/refresh-lock.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-data-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect advisories
        run: |
          npm audit --package-lock-only --json > "$RUNNER_TEMP/audit-before.json" || true
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const audit = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/audit-before.json', 'utf8'))
          if (audit.error) throw new Error(audit.error.summary || 'Audit unavailable')
          console.log(JSON.stringify(audit.metadata.vulnerabilities))
          for (const [name, item] of Object.entries(audit.vulnerabilities)) {
            console.log(JSON.stringify({name, severity: item.severity, direct: item.isDirect, fixAvailable: item.fixAvailable, advisories: item.via.filter(v => typeof v === 'object').map(v => ({title: v.title, url: v.url}))}))
          }
          JS
      - name: Apply compatible patches
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Verify advisories
        run: npm audit --package-lock-only --audit-level=low
      - name: Commit lockfile
        run: |
          git diff --exit-code -- package.json
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- package-lock.json
            git commit -m 'Patch vulnerable dependencies'
            git push origin HEAD:fix/account-data-isolation
          fi
